[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-pet-agent"
version = "0.2.0"
description = "Desktop pet agent — Claude Code visual UI with reminders and web search."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pywebview>=6.2",
    "webview2>=0.0.4",
    "pystray>=0.19",
    "pillow>=10",
    "mcp>=1.0",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.5",
    "platformdirs>=4",
    "pywin32>=306",
]

[project.scripts]
pet = "desktop_pet_agent.app_webview:main"

[tool.setuptools.packages.find]
where = ["src"]
