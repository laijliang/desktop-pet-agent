[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-pet-agent"
version = "0.2.0"
description = "Desktop pet agent — Claude Code visual UI with reminders and web search."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    "mcp>=1.0",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.5",
    "platformdirs>=4",
]

[project.scripts]
pet = "desktop_pet_agent.app:main"

[tool.setuptools.packages.find]
where = ["src"]
